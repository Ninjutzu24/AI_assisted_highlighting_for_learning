<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Reading Support</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 280px;
      padding: 16px;
      margin: 0;
      background: #f8fafc;
      color: #111827;
    }
    h2 { font-size: 18px; margin-top: 0; margin-bottom: 12px; }
    p  { font-size: 13px; color: #4b5563; margin-bottom: 12px; }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: #6b7280;
    }
    button.secondary:hover { background: #4b5563; }
    button.danger {
      background: #dc2626;
    }
    button.danger:hover { background: #b91c1c; }

    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      box-sizing: border-box;
      margin-bottom: 4px;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #374151;
      min-height: 16px;
    }

    /* ── Panoul de sesiune activă ── */
    #activeSession {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    #activeSession strong { color: #1d4ed8; }
    #activeSession .step-label {
      display: inline-block;
      margin-top: 4px;
      background: #2563eb;
      color: white;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .hidden { display: none !important; }

    hr { border: none; border-top: 1px solid #e5e7eb; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>AI Reading Support</h2>

  <!-- ── SETUP (vizibil doar când nu există sesiune) ── -->
  <div id="setupSection">
    <p>Enter your participant ID to start the study session.</p>
    <input id="participantId" type="text" placeholder="Participant ID (e.g. 42)" />
    <button id="startStudy">▶ Start Session</button>
  </div>

  <!-- ── SESIUNE ACTIVĂ (vizibil când există studyState) ── -->
  <div id="activeSection" class="hidden">
    <div id="activeSession">
      <div id="participantLabel"></div>
      <div id="stepLabel" class="step-label"></div>
    </div>
    <button id="btnResumeMode">↺ Re-run Current Mode</button>
    <button id="btnResetSession" class="danger">✕ Reset Session</button>
  </div>

  <div id="status">Ready.</div>

  <script src="popup.js"></script>
</body>
</html>
